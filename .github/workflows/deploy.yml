name: CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to deploy'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.7.2
        env:
          MARIADB_ROOT_PASSWORD: test_password
          MARIADB_DATABASE: simpledbstarterTestDB
        ports:
          - 3306:3306

      redis:
        image: redis:7.2.7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run API tests
        working-directory: api
        run: npm test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  deploy:
    needs:
      - test
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploying..."
