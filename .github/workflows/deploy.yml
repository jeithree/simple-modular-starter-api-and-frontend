name: CI/CD

on:
#   push:
#     branches:
#       - main

  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to deploy (optional, defaults to the latest commit on main)'
        required: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api || steps.manual.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend || steps.manual.outputs.frontend }}
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Get commit SHA
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
                - 'api/**'
                - '.github/**'

            frontend:
                - 'frontend/**'
                - '.github/**'

      - name: Mark both applications for manual deployment
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "api=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"

  test:
    needs: detect-changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.api == 'true'

    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.7.2
        env:
          MARIADB_ROOT_PASSWORD: test_password
          MARIADB_DATABASE: simpledbstarterTestDB
        ports:
          - 3306:3306

      redis:
        image: redis:7.2.7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run API tests
        working-directory: api
        run: npm test

  build:
    needs: detect-changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  deploy-api:
    needs:
      - detect-changes
      - test

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.api == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: user-api
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/user-api/htdocs/api.jeitdev.com
            git fetch origin
            git checkout ${{ needs.detect-changes.outputs.commit }}
            bash ./api/scripts/deploy.sh

  deploy-frontend:
    needs:
      - detect-changes
      - build

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: user-frontend
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/user-frontend/htdocs/app.jeitdev.com
            git fetch origin
            git checkout ${{ needs.detect-changes.outputs.commit }}
            bash ./frontend/scripts/deploy.sh
